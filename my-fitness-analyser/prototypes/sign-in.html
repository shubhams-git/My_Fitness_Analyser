<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080E16">
  <title>Sign in — My Fitness Analyser</title>
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/field-notes.css">
  <link rel="stylesheet" href="/sign-in.css">
</head>
<body data-theme="field-notes" class="fn-app sign-in-page">
  <a class="skip-link" href="#sign-in-form">Skip to sign in</a>
  <main class="sign-in-shell">
    <header class="sign-in-masthead">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 25 11 7h5L8 25m9 0 8-18h4l-8 18"/></svg>
      <span>My Fitness Analyser</span>
    </header>
    <section class="sign-in-panel" aria-labelledby="signin-title">
      <h1 id="signin-title">Sign in</h1>
      <p>Use the email address on your invitation.</p>
      <form id="sign-in-form" tabindex="-1">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="show-password" class="password-visibility" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password"><span aria-hidden="true">Show</span></button>
        </div>
        <p id="sign-in-status" role="alert"></p>
        <button class="primary-button sign-in-submit" type="submit">Sign in</button>
      </form>
      <p class="sign-in-help">This browser stays signed in. Sign out on a shared device.</p>
    </section>
    <svg class="sign-in-track" viewBox="0 0 330 400" fill="none" aria-hidden="true">
      <path d="M12 400V143a143 143 0 0 1 286 0v164m-34 0V143a109 109 0 0 0-218 0v257m34 0V143a75 75 0 0 1 150 0v164m-34 0V143a41 41 0 0 0-82 0v257"/>
      <path class="sign-in-start" d="M8 305h110m79-69h105"/>
    </svg>
  </main>
  <script type="module" src="/sign-in.js"></script>
</body>
</html>
